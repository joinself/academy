site_name: Joinself Academy

theme:
  name: material
  logo: assets/logo.png  # Add this line
  favicon: assets/favicon.png

  features:
    - announce.dismiss
    # - content.action.edit
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    # Set to light mode
    scheme: default
    primary: indigo
    accent: custom
  font:
    text: Open Sauce One, sans-serif
    code: Open Sauce One, sans-serif

extra_css:
  - assets/stylesheets/custom.css

extra_javascript:
  - assets/javascripts/custom.js
  - https://emgithub.com/embed-v2.js

nav:
  - Solutions:
    - Overview: solutions/overview.md
    - Authentication: solutions/authentication.md
    - Identity Verification: solutions/identity-verification.md
    - Digital Signatures: solutions/digital-signatures.md
  - Concepts:
    - Overview: concepts/overview.md
    - Identity Foundations: concepts/decentralized-identity.md
    - Secure Connections: concepts/secure-connections.md
    - Verifiable Credentials: concepts/verifiable-credentials.md
    - Message Security: concepts/message-layer-security.md
    - Cryptographic Foundations: concepts/cryptographic-foundations.md
  - Examples:
    - Overview: examples/overview.md
    - Setup Guide: examples/setup.md
    - Connections: examples/connections.md
    - Credentials: examples/credentials.md
    - Chat & Messaging: examples/chat.md
    - Advanced Features: examples/advanced.md
    - Troubleshooting: examples/troubleshooting.md
    - Resources & Community: examples/resources.md
    - Production Deployment: examples/production.md

# Extensions
markdown_extensions:
  - codehilite:
      guess_lang: False
      use_pygments: True
      noclasses: True
      pygments_style: monokai
  - pymdownx.tabbed:
      alternate_style: true        
  - abbr
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.critic

